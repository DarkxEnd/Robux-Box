name: Publish policy pages

on:
  push:
    branches: [main]
    paths:
      - "web_public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Play Console requires a reachable privacy policy URL, and AdMob requires the
# same. These pages are the ones referenced by AppConfig.privacyUrl/termsUrl,
# so a broken deploy here breaks store compliance, not just a link.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The Pages site has to be created once, by hand, at
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      # This cannot be automated from here: enablement: true was tried and
      # the API refused with "Create Pages site failed. Error: Resource not
      # accessible by integration" — creating a site needs admin rights, and
      # GITHUB_TOKEN does not have them whatever `permissions` declares. Until
      # someone flips that setting, this step fails with "Get Pages site
      # failed ... Not Found" and the deploy below is skipped.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_public
      - id: deployment
        uses: actions/deploy-pages@v4
