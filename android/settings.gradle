pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// AGP and Kotlin are pinned to the floors Flutter 3.47 enforces, in
// DependencyVersionChecker.kt: errorAGPVersion 8.11.1 and errorKGPVersion
// 2.2.20. Below either, the Flutter Gradle plugin refuses to apply and the
// build dies before compiling — which is how 8.7.3 and 2.1.0 failed.
//
// Deliberately staying on AGP 8.x rather than the 9.1.0 the current template
// ships. AGP 9 reads only the new DSL, and android/app/build.gradle here is
// the old Groovy one, so moving to 9 means migrating that file too. Flutter
// warns below AGP 9.0.1 and Gradle 9.1.0 but only warns; that migration is
// worth doing on its own, not folded into a build fix.
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
