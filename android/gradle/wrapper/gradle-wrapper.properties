# Pinned because the file was absent: with no wrapper properties the Flutter
# tool generates a default, and that default is Gradle 8.9 — below the 8.14.0
# minimum Flutter 3.47 enforces, so `flutter build appbundle` failed with
# "Your project's Gradle version (8.9.0) is lower than Flutter's minimum
# supported version of 8.14.0" before compiling anything.
#
# gradlew and gradle-wrapper.jar stay gitignored, as in a stock Flutter
# project; the tool regenerates those. This file is the one that has to be
# committed, because it is what decides the version.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
